name: dsh-bundle

on:
  push:
    paths:
      - 'src/**'
      - 'lib/**'
      - '.dsh/**'
      - 'cordis.patch.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'README.md'
      - 'README.en-US.md'
      - 'skills/**'
      - 'agents/**'
      - 'hooks/**'
      - '.github/workflows/dsh-bundle.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'lib/**'
      - '.dsh/**'
      - 'cordis.patch.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'README.md'
      - 'README.en-US.md'
      - 'skills/**'
      - 'agents/**'
      - 'hooks/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Committed build artifact is current
        run: git diff --exit-code -- lib

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint markdown
        run: npx --yes markdownlint-cli@0.42.0 --ignore "**/node_modules/**" .
