# Dependabot keeps the dsh bundle's npm dependencies current.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for all @deepseek-ai/* dev-dependency bumps (dsh API mirrors).
      dsh-ecosystem:
        patterns:
          - "@deepseek-ai/*"

  # GitHub Actions are pinned to commit SHAs; Dependabot opens the bump PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
